# Stateless TCP forwarding ONLY. No credentials, admin UI, API or log copies.
global
  maxconn 128
defaults
  mode tcp
  timeout connect 5s
  timeout client 10m
  timeout server 10m
  timeout check 3s
frontend decoy_ssh
  bind *:2222
  maxconn 32
  default_backend cowrie_ssh
backend cowrie_ssh
  server cowrie cowrie:2222 check inter 10s
frontend decoy_telnet
  bind *:2323
  maxconn 32
  default_backend cowrie_telnet
backend cowrie_telnet
  server cowrie cowrie:2223 check inter 10s
frontend decoy_ftp
  bind *:2121
  maxconn 32
  default_backend opencanary_ftp
backend opencanary_ftp
  server opencanary opencanary:2121 check inter 10s
frontend decoy_mysql
  bind *:13306
  maxconn 32
  default_backend opencanary_mysql
backend opencanary_mysql
  server opencanary opencanary:13306 check inter 10s
