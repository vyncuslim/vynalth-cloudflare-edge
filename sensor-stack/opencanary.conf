{
  "device.node_id": "vynalth-lab-protocol-sensor",
  "ip.ignorelist": [],
  "ftp.enabled": true,
  "ftp.port": 2121,
  "ftp.banner": "vsFTPd 3.0.5 ready",
  "mysql.enabled": true,
  "mysql.port": 13306,
  "mysql.banner": "5.7.42-0ubuntu0.22.04.1",
  "redis.enabled": true,
  "redis.port": 16379,
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(message)s"
        }
      },
      "handlers": {
        "console": {
          "class": "logging.StreamHandler",
          "stream": "ext://sys.stdout"
        }
      }
    }
  },
  "ftp.log_auth_attempt_initiated": true,
  "mysql.log_connection_made": true
}
