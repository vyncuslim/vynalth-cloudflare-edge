name = "vynalth-cloudflare-edge"
main = "src/index.js"
compatibility_date = "2026-09-19"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "vynalthai.com/*", zone_name = "vynalthai.com" },
  { pattern = "*.vynalthai.com/*", zone_name = "vynalthai.com" },
  { pattern = "vyncuslim.com/*", zone_name = "vyncuslim.com" },
  { pattern = "*.vyncuslim.com/*", zone_name = "vyncuslim.com" },
  { pattern = "sleepsomno.com/*", zone_name = "sleepsomno.com" },
  { pattern = "*.sleepsomno.com/*", zone_name = "sleepsomno.com" },
  { pattern = "powiismunc.com/*", zone_name = "powiismunc.com" },
  { pattern = "*.powiismunc.com/*", zone_name = "powiismunc.com" },
  { pattern = "vitamindai.online/*", zone_name = "vitamindai.online" },
  { pattern = "*.vitamindai.online/*", zone_name = "vitamindai.online" },
  { pattern = "vynalthai.si/*", zone_name = "vynalthai.si" },
  { pattern = "*.vynalthai.si/*", zone_name = "vynalthai.si" },
  { pattern = "vyncuslim.si/*", zone_name = "vyncuslim.si" },
  { pattern = "*.vyncuslim.si/*", zone_name = "vyncuslim.si" }
]

[vars]
SCHOOL_POLICY_ENABLED = "false"

[[services]]
binding = "SCHOOL_POLICY"
service = "website-block-by-school-powiis"

[observability]
enabled = true

# To enable the optional signed campus reporter, create a dedicated KV namespace
# in Cloudflare, then bind it as SCHOOL_BEACON_KV in Wrangler or the dashboard.
# Example only (DO NOT commit placeholder IDs as real):
# [[kv_namespaces]]
# binding = "SCHOOL_BEACON_KV"
# id = "REPLACE_WITH_ACTUAL_32_CHAR_KV_NAMESPACE_ID"
# Add the bearer/list and signing secrets via wrangler secret put or dashboard.
