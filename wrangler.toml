name = "vynalth-cloudflare-edge"
main = "src/index.js"
compatibility_date = "2026-09-19"
workers_dev = true

# Routes and custom-domain triggers are already owned by Cloudflare.
# DO NOT re-register them through Wrangler: the current account has existing
# patterns which cause Cloudflare error 10020 (duplicate route). Cloudflare's
# route list is now managed from the Cloudflare dashboard; omit both
# 'route' and 'routes' to avoid re-registering existing route patterns.
# Keep workers_dev=true because the public workers.dev URL was already enabled.
# Preserve existing Dashboard > Settings > Domains & Routes assignments.
# Never automatically delete or seize another Worker's route.
[vars]
# Explicit operator-approved, narrow suspicious-probe event forwarding.
# Never send IP, cookies, request body or query strings. Sender is async,
# non-blocking, and automatically fails closed when the secret is absent.
# 2026-10-31: enable following successful fix for route conflict code 10020.
# Require real database proof before claiming production ingestion success.
THREAT_INTEL_COLLECT_ENABLED = "true"
CONSENT_CMP_ENABLED = "false"
SCHOOL_TRUSTED_SSO_EXEMPTION_ENABLED = "false"
# Explicit, owner-accepted approximate OSM GPS policy; consent remains off.
GPS_GATE_ENABLED = "true"
# Show GPS only when Cloudflare IP country is MY, browser timezone is MY,
# or source location is unavailable. Foreign visitors first pass a lightweight
# browser-timezone check; this is NOT a comprehensive VPN detection service.
GPS_REGION_TIMEZONE_ENABLED = "true"
# Server-side Telegram notification for GPS 403, separate from visitor access.
# Requires Telegram Bot and Chat ID configured as Worker secrets.
# Reuses existing TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID if bound.
GPS_TELEGRAM_ALERTS_ENABLED = "true"
# Fresh GPS is required on first access, after the signed outside cookie
# expires, and whenever the location is inside or near a campus boundary.
GPS_RECHECK_EVERY_DOCUMENT = "true"
# Once an OUTSIDE fix is confirmed, let the visitor navigate and refresh
# directly for the remaining signed 15-minute cookie lifetime. Do not use
# IP city/country as evidence of being outside the school.
GPS_OUTSIDE_SESSION_FASTPASS = "true"
# 10-minute owner GPS access portal enabled by the site operator.
# No reusable owner code or Cookie-signing secret is committed to GitHub.
# The source contains only a salted PBKDF2 code verifier; random login tokens
# and their 600-second expirations are stored server-side in CONSENT_KV.
# If CONSENT_KV is unavailable, the portal fails closed (503).
# This does NOT grant admin privileges or bypass WAF, school-IP blocks or auth.
VYNALTH_TEMP_ACCESS_ENABLED = "true"
# Operator-approved approximate polygon assessment, NOT a certified survey.
GPS_POLYGON_MODE = "enforce"
GPS_POLYGON_ENFORCEMENT_APPROVED = "true"
GPS_OSM_APPROXIMATE_ENFORCEMENT_APPROVED = "true"
GPS_BOUNDARY_BUFFER_METERS = "30"
# GPS validation is mandatory. Invalid secret/geometry does NOT bypass the gate.
# The Worker renders a readable temporary-unavailable page for HTML (503).
# API routes return JSON 503; legal, status recovery and auth routes stay available.
GPS_CONFIG_ERROR_ACTION = "closed"
# © OpenStreetMap contributors, ODbL 1.0; boundaries are NOT official.
GPS_CAMPUS_POLYGONS_JSON = '{"type":"FeatureCollection","name":"POWIIS OSM candidates -- RESEARCH ONLY -- NEVER production hard block","attribution":"© OpenStreetMap contributors (ODbL 1.0), www.openstreetmap.org/copyright","evidence_date":"2026-10-11","features":[{"type":"Feature","properties":{"campus_id":"powiis-balik-pulau","campus_name":"POWIIS Balik Pulau","boundary_classification":"OSM_MAPPED","official_boundary_verified":false,"source_url":"https://www.openstreetmap.org/way/808258869","source_object_last_modified":"2020-05-26","note":"Candidate community mapping; NOT JUPEM/PA certified."},"geometry":{"type":"Polygon","coordinates":[[[100.2204351,5.3687259],[100.2205244,5.3687227],[100.2211082,5.3678177],[100.2194495,5.3666808],[100.2193347,5.3667189],[100.2187861,5.3675954],[100.2188084,5.3676716],[100.2204351,5.3687259]]]}},{"type":"Feature","properties":{"campus_id":"powiis-tanjung-bungah","campus_name":"POWIIS Tanjung Bungah","boundary_classification":"OSM_MAPPED","official_boundary_verified":false,"source_url":"https://www.openstreetmap.org/way/790940312","source_object_last_modified":"2021-10-25","note":"Candidate community mapping; NOT JUPEM/PA certified."},"geometry":{"type":"Polygon","coordinates":[[[100.2848077,5.4619151],[100.2847908,5.4616936],[100.2847531,5.4612593],[100.2846966,5.4605266],[100.284625,5.4602657],[100.2845571,5.4602357],[100.2836147,5.4605362],[100.2835818,5.4606236],[100.2836987,5.4618124],[100.2839033,5.4617889],[100.2841882,5.4617563],[100.2842197,5.462029],[100.2847521,5.4619757],[100.2848077,5.4619151]]]}}]}'
# Private photos are withheld until a private R2 binding and origin cleanup are verified.
JINGXIN_PRIVATE_MEDIA_ENABLED = "false"



# Existing Cloudflare namespace previously validated in GPS/CMP review branches.
# This stores ONLY random one-use GPS navigation/freshness markers.
# No coordinates or account secrets are stored in this KV namespace.
[[kv_namespaces]]
binding = "CONSENT_KV"
id = "f687e465ac0441d7a6ca18aaa9ed91f8"

# The existing edge Worker owns HTTP routes. The policy Worker has no routes:
# it is called privately, so the origin and security/tracing logic is preserved.
[[services]]
binding = "SCHOOL_POLICY"
service = "website-block-by-school-powiis"

[observability]
enabled = true
