name = "vynalth-cloudflare-edge"
main = "src/index.js"
compatibility_date = "2026-09-19"
workers_dev = true

# Keep consent-management and account-policy exemptions disabled until:
# 1) CONSENT_KV namespace is provisioned/bound in Cloudflare,
# 2) SSO issuer creates signed per-domain assertions,
# 3) the four-zone consent flow and core app routes pass review.
# Deploy routes belong at the TOML root. Do not put them inside [vars];
# that would define env.vars.routes instead of Worker routing rules.
# Exact eight requested routes across seven zones; apex is only vynalthai.com.
# Other six apex hostnames are intentionally not added to avoid conflicting
# with other existing Workers or route ownership. Existing routes on other
# Workers are NOT managed by this config.
routes = [
  { pattern = "*.sleepsomno.com/*", zone_name = "sleepsomno.com" },
  { pattern = "*.vyncuslim.com/*", zone_name = "vyncuslim.com" },
  { pattern = "*.vynalthai.com/*", zone_name = "vynalthai.com" },
  { pattern = "*.vynalthai.si/*", zone_name = "vynalthai.si" },
  { pattern = "*.powiismunc.com/*", zone_name = "powiismunc.com" },
  { pattern = "*.vyncuslim.si/*", zone_name = "vyncuslim.si" },
  { pattern = "vynalthai.com/*", zone_name = "vynalthai.com" },
  { pattern = "*.vitamindai.online/*", zone_name = "vitamindai.online" }
]

[vars]
CONSENT_CMP_ENABLED = "false"
SCHOOL_TRUSTED_SSO_EXEMPTION_ENABLED = "false"
# Explicit, owner-accepted approximate OSM GPS policy; consent remains off.
GPS_GATE_ENABLED = "true"
# Operator-approved approximate polygon assessment, NOT a certified survey.
GPS_POLYGON_MODE = "enforce"
GPS_POLYGON_ENFORCEMENT_APPROVED = "true"
GPS_OSM_APPROXIMATE_ENFORCEMENT_APPROVED = "true"
GPS_BOUNDARY_BUFFER_METERS = "30"
# Availability fallback on missing secret/invalid polygon; raises operator error.
# During fallback, GPS restriction is INACTIVE even though the flag is true.
GPS_CONFIG_ERROR_ACTION = "bypass"
# © OpenStreetMap contributors, ODbL 1.0; boundaries are NOT official.
GPS_CAMPUS_POLYGONS_JSON = '{"type":"FeatureCollection","name":"POWIIS OSM candidates -- RESEARCH ONLY -- NEVER production hard block","attribution":"© OpenStreetMap contributors (ODbL 1.0), www.openstreetmap.org/copyright","evidence_date":"2026-10-11","features":[{"type":"Feature","properties":{"campus_id":"powiis-balik-pulau","campus_name":"POWIIS Balik Pulau","boundary_classification":"OSM_MAPPED","official_boundary_verified":false,"source_url":"https://www.openstreetmap.org/way/808258869","source_object_last_modified":"2020-05-26","note":"Candidate community mapping; NOT JUPEM/PA certified."},"geometry":{"type":"Polygon","coordinates":[[[100.2204351,5.3687259],[100.2205244,5.3687227],[100.2211082,5.3678177],[100.2194495,5.3666808],[100.2193347,5.3667189],[100.2187861,5.3675954],[100.2188084,5.3676716],[100.2204351,5.3687259]]]}},{"type":"Feature","properties":{"campus_id":"powiis-tanjung-bungah","campus_name":"POWIIS Tanjung Bungah","boundary_classification":"OSM_MAPPED","official_boundary_verified":false,"source_url":"https://www.openstreetmap.org/way/790940312","source_object_last_modified":"2021-10-25","note":"Candidate community mapping; NOT JUPEM/PA certified."},"geometry":{"type":"Polygon","coordinates":[[[100.2848077,5.4619151],[100.2847908,5.4616936],[100.2847531,5.4612593],[100.2846966,5.4605266],[100.284625,5.4602657],[100.2845571,5.4602357],[100.2836147,5.4605362],[100.2835818,5.4606236],[100.2836987,5.4618124],[100.2839033,5.4617889],[100.2841882,5.4617563],[100.2842197,5.462029],[100.2847521,5.4619757],[100.2848077,5.4619151]]]}}]}'
# Private photos are withheld until a private R2 binding and origin cleanup are verified.
JINGXIN_PRIVATE_MEDIA_ENABLED = "false"



# The existing edge Worker owns HTTP routes. The policy Worker has no routes:
# it is called privately, so the origin and security/tracing logic is preserved.
[[services]]
binding = "SCHOOL_POLICY"
service = "website-block-by-school-powiis"

[observability]
enabled = true
