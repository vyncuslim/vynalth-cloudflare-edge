name: Validate honeypot evidence custody and privacy
on:
  pull_request:
    paths:
      - "sensor-stack/evidence_capture.py"
      - "sensor-stack/test_evidence_capture.py"
      - "sensor-stack/EVIDENCE.md"
      - ".github/workflows/validate-honeypot-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-forensic-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify evidence capture module
        run: |
          python -m compileall -q sensor-stack/evidence_capture.py sensor-stack/test_evidence_capture.py
          python -m unittest -v sensor-stack/test_evidence_capture.py
      - name: Assert evidence does not require production secrets or connect to cloud
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("sensor-stack/evidence_capture.py").read_text()
          for forbidden in (
              "urllib.request", "requests.", "fetch(", "socket.socket(",
              "connect(", "subprocess.run(", "os.system(", "eval(",
              "exec(", "importlib.import_module", "mysql://"
          ):
              assert forbidden not in p, forbidden
          assert "os.O_EXCL" in p
          assert "os.O_NOFOLLOW" in p
          assert "hmac.compare_digest" in p
          print("PASS: offline restricted capture only; no network, no execution")
          PY
      - name: No production deploy
        run: |
          echo "No public VM, no cloud deploy, no TiDB DDL, no binary upload."
