name: Verify real honeypot protocol evidence in GitHub cloud
on:
  pull_request:
    paths:
      - 'sensor-stack/**'
      - 'threat-intel/**'
      - '.github/workflows/honeypot-real-protocol-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-isolated-connection-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Docker Compose and all loopback-only port mappings
        run: |
          docker compose -f sensor-stack/compose.lab.yaml config --quiet
          python - <<'PY'
          from pathlib import Path
          s=Path('sensor-stack/compose.lab.yaml').read_text()
          for port in (2222,2223,2121,13306,16379):
              assert f'127.0.0.1:{port}:{port}' in s
          assert 'internal: true' in s
          assert '0.0.0.0:' not in s
          print('PASS: no public bound ports')
          PY
      - name: Launch independent disposable protocol sensors
        run: |
          docker compose -f sensor-stack/compose.lab.yaml up -d
          docker compose -f sensor-stack/compose.lab.yaml ps --format json
      - name: Connect via real protocols inside dedicated isolated Docker bridge
        run: |
          docker compose -f sensor-stack/compose.lab.yaml run --rm --no-deps probe
      - name: Build SSH fake-shell test image on disposable cloud runner
        run: |
          docker compose -f sensor-stack/compose.lab.yaml build ssh-replay-probe
      - name: Establish authentic Cowrie shell and capture harmless command
        run: |
          docker compose -f sensor-stack/compose.lab.yaml run --rm --no-deps ssh-replay-probe
      - name: Verify genuine Cowrie/OpenCanary events from the trusted runner
        run: |
          python -u sensor-stack/ci_protocol_probe.py --verify
      - name: Verify full sanitized evidence and signed export workflow (synthetic data only)
        run: |
          python -m unittest discover -v -s sensor-stack -p 'test_*.py'
          python -m unittest discover -v -s threat-intel -p 'test_*.py'
          python threat-intel/ci_full_chain.py
          npm install --ignore-scripts --no-audit --no-fund --silent
          node --test src/sensor-ingest.test.js
      - name: Validate signed forensic index against REAL Cowrie connection log
        env:
          VYNALTH_EVIDENCE_HMAC_KEY: "ci-test-only-fresh-ephemeral-evidence-key-00000001"
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          docker cp vynalth-lab-cowrie:/cowrie/cowrie-git/var/log/cowrie/cowrie.json "$scratch/cowrie.jsonl"
          docker cp vynalth-lab-cowrie:/cowrie/cowrie-git/var/lib/cowrie/tty "$scratch/tty"
          python sensor-stack/evidence_capture.py \
            --source cowrie --input "$scratch/cowrie.jsonl" --tty-dir "$scratch/tty" --output "$scratch/restricted-evidence.json"
          python sensor-stack/evidence_capture.py \
            --source cowrie --input "$scratch/restricted-evidence.json" --verify
          python - "$scratch/restricted-evidence.json" <<'PY'
          import json,sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          counts=data["counts_by_class"]
          assert counts.get("honeypot_login_accepted",0)>=1, "fake-shell auth event absent"
          assert counts.get("shell_command",0)>=1, "command event absent"
          assert counts.get("tty_finalized",0)>=1, "real TTY finalized event absent"
          tapes=[x["evidence"] for x in data["records"]
                 if x["event_class"]=="tty_finalized"]
          print(json.dumps({"tty_verification_states":[e["verification"] for e in tapes if e],
                            "tty_files_located":sum(bool(e and e["artifact"]) for e in tapes)}))
          assert any(e and e["verification"]=="locally_hashed" and
                     e["artifact"] and e["artifact"]["sha256"] for e in tapes)
          print(json.dumps({"fake_shell_login":True,"command_recorded":True,
                            "tty_artifact_verified":True,
                            "public_attacks_captured":False}))
          PY
          echo "PASS: genuine Cowrie fake-shell session and locally hashed TTY evidence"
      - name: Safely decode genuine Cowrie TTY frames (without displaying terminal output)
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          docker cp vynalth-lab-cowrie:/cowrie/cowrie-git/var/log/cowrie/cowrie.json "$scratch/cowrie.jsonl"
          docker cp vynalth-lab-cowrie:/cowrie/cowrie-git/var/lib/cowrie/tty "$scratch/tty"
          python sensor-stack/ci_validate_playlog.py "$scratch/cowrie.jsonl" "$scratch/tty"
      - name: Verify restart-safe restricted spool from genuine Cowrie events
        env:
          VYNALTH_EVIDENCE_HMAC_KEY: "ci-test-only-fresh-ephemeral-evidence-key-00000001"
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          docker cp vynalth-lab-cowrie:/cowrie/cowrie-git/var/log/cowrie/cowrie.json "$scratch/cowrie.jsonl"
          python sensor-stack/durable_spool.py --source cowrie --sensor-id ci-cowrie-lab --input "$scratch/cowrie.jsonl" --db "$scratch/private/spool.db"
          python sensor-stack/durable_spool.py --db "$scratch/private/spool.db" --verify
          python - "$scratch/private/spool.db" <<'PY'
          import json, sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              counts=dict(db.execute("SELECT event_class,COUNT(*) FROM sanitized_event GROUP BY event_class"))
          assert counts.get("honeypot_login_accepted",0)>=1
          assert counts.get("shell_command",0)>=1
          assert counts.get("tty_finalized",0)>=1
          print(json.dumps({"real_cowrie_durable_spool":True,"event_classes_verified":True,"public_ip_sensor":False}))
          PY
          python sensor-stack/durable_spool.py --source cowrie --sensor-id ci-cowrie-lab --input "$scratch/cowrie.jsonl" --db "$scratch/private/spool.db"
      - name: Ensure test runner was isolated and production unchanged
        run: |
          echo "CI only: NO Vercel/Cloudflare deploy; NO TiDB credentials; NO internet sensor; NO external event upload."
      - name: Emit redacted startup diagnostics only if a probe fails
        if: failure()
        run: python sensor-stack/ci_container_diagnostics.py
      - name: Erase ephemeral local-only honeypot evidence
        if: always()
        run: |
          docker compose -f sensor-stack/compose.lab.yaml down -v --remove-orphans --timeout 5 || true
