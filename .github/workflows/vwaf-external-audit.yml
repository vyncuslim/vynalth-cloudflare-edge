name: VWAF external security scanning
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/vwaf-**'
      - 'package.json'
      - '.github/workflows/vwaf-external-audit.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/vwaf-**'
      - 'package.json'
      - '.github/workflows/vwaf-external-audit.yml'
  schedule:
    - cron: '29 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          category: /language:javascript-typescript
      - run: node scripts/vwaf-audit-summary.mjs codeql codeql-results
  external-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve current dependency tree without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Query npm advisory database
        shell: bash
        run: |
          set +e
          npm audit --json --audit-level=high > "${RUNNER_TEMP}/vwaf-npm-audit.json"
          scan_exit=$?
          set -e
          node scripts/vwaf-audit-summary.mjs npm "${RUNNER_TEMP}/vwaf-npm-audit.json"
          if [ "$scan_exit" -ne 0 ]; then exit "$scan_exit"; fi
