name: VWAF acceptance
on:
  pull_request:
    paths:
      - 'src/vwaf-**'
      - 'src/vynalth-waf-**'
      - 'scripts/vwaf-**'
      - '.github/workflows/vwaf-acceptance.yml'
      - 'package.json'
      - 'docs/vwaf-ga-checklist.json'
  push:
    branches: [main]
    paths:
      - 'src/vwaf-**'
      - 'src/vynalth-waf-**'
      - 'scripts/vwaf-**'
      - '.github/workflows/vwaf-acceptance.yml'
      - 'package.json'
      - 'docs/vwaf-ga-checklist.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve original synthetic acceptance evidence
        shell: bash
        run: |
          set -o pipefail
          npm run vwaf:acceptance | tee "${RUNNER_TEMP}/vwaf-acceptance.log"
      - name: Verify GA gate behavior
        shell: bash
        run: |
          set -o pipefail
          node scripts/vwaf-check-ga-command.mjs | tee "${RUNNER_TEMP}/vwaf-ga-check.log"
      - name: Bounded portable middleware benchmark (offline)
        shell: bash
        run: |
          set -o pipefail
          node scripts/vwaf-portable-load.mjs | tee "${RUNNER_TEMP}/vwaf-portable-load.log"
      - name: Retain candidate evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vwaf-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vwaf-acceptance.log
            ${{ runner.temp }}/vwaf-ga-check.log
            ${{ runner.temp }}/vwaf-portable-load.log
          retention-days: 45
          if-no-files-found: error
