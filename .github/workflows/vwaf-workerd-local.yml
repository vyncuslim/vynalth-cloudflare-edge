name: VWAF local workerd qualification
on:
  pull_request:
    paths:
      - 'src/vwaf-**'
      - 'src/vynalth-waf-**'
      - 'scripts/vwaf-workerd-**'
      - 'scripts/vwaf-verify-workerd-report.mjs'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/vwaf-workerd-local.yml'
  push:
    branches: [main]
    paths:
      - 'src/vwaf-**'
      - 'src/vynalth-waf-**'
      - 'scripts/vwaf-workerd-**'
      - 'scripts/vwaf-verify-workerd-report.mjs'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/vwaf-workerd-local.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Measure isolated worker runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep '^compatibility_date = ' wrangler.toml)" = "$(grep '^compatibility_date = ' scripts/vwaf-workerd-local.toml)"
          ./node_modules/.bin/wrangler --version
          setsid ./node_modules/.bin/wrangler dev --local --config scripts/vwaf-workerd-local.toml --ip 127.0.0.1 --port 18765 --show-interactive-dev-session=false > "${RUNNER_TEMP}/vwaf-workerd-startup.log" 2>&1 &
          pid=$!
          trap 'kill -- -"$pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 45); do
            kill -0 "$pid" 2>/dev/null || break
            if [ "$(curl --noproxy '*' -fsS --max-time 2 http://127.0.0.1:18765/ready 2>/dev/null || true)" = "vwaf-workerd-local-ready" ]; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            tail -n 40 "${RUNNER_TEMP}/vwaf-workerd-startup.log"
            exit 1
          fi
          node scripts/vwaf-workerd-client.mjs "${RUNNER_TEMP}/vwaf-workerd.json"
          node scripts/vwaf-verify-workerd-report.mjs "${RUNNER_TEMP}/vwaf-workerd.json"
      - name: Retain local runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vwaf-workerd-local-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vwaf-workerd.json
          if-no-files-found: warn
          retention-days: 45
