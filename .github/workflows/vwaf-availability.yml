name: VWAF public availability
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/vwaf-availability.mjs'
      - '.github/workflows/vwaf-availability.yml'
permissions:
  contents: read
concurrency:
  group: vwaf-public-availability
  cancel-in-progress: false
jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/vwaf-availability.mjs
