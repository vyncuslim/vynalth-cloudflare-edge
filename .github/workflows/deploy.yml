# Cloudflare Workers Builds is the only production deployer.
# GitHub Actions intentionally runs offline checks only: no Cloudflare API token.
name: Verify Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run crawler and edge security regressions
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify domain routes and disabled safety flags
        run: python3 .github/scripts/verify-routes.py
      - name: Dry-run Worker configuration (no deploy)
        run: npx wrangler deploy --dry-run --outdir .wrangler-route-test
