name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Account ID is an identifier, not a credential; use the confirmed account scope.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'f9126fb2edaf6b83dee3e5f841a29850' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify domain routes and disabled safety flags
        run: python3 .github/scripts/verify-routes.py
      - name: Dry-run Worker configuration
        run: npm run check:build

      - name: Require deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Deployment blocked::Set repository Actions secret CLOUDFLARE_API_TOKEN (scoped to the confirmed Cloudflare account). Do not mark skipped deploys as successful."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Deployment blocked::Cloudflare account scope missing."
            exit 1
          fi

      # Upload a Worker version and promote it, preserving all existing routes.
      # Do not use `wrangler deploy` here: it can recreate routes and fail 10020.
      - name: Deploy Worker version without modifying existing route triggers
        run: npm run deploy
