name: Audit ZoKivo Cloudflare WAF 429 (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate audit script
        run: node --check scripts/audit-zokivo-waf.mjs
      - name: Audit zone-level rate-limiting rules without changing them
        env:
          CLOUDFLARE_WAF_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_WAF_AUDIT_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/audit-zokivo-waf.mjs
