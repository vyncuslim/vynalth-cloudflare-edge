name: Unified Consent and GPS Gate Regression Tests
on:
  push:
    branches:
      - review/universal-consent-kv-20261011
      - review/integrate-consent-gps-20261011
      - fix/wrangler-14-domain-routes-20261011
    paths:
      - "src/universal-consent.js"
      - "src/guest-gps.js"
      - "src/guest-gps.test.js"
      - "src/gps-telegram-alert.js"
      - "src/gps-telegram-alert.test.js"
      - "src/jingxin-media.js"
      - "src/jingxin-media.test.js"
      - "test/edge.test.js"
      - "src/universal-consent.test.js"
      - "src/index.js"
      - "src/temporary-ip-block.js"
      - ".github/workflows/consent-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "wrangler.toml"
      - ".github/scripts/verify-routes.py"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/consent-tests.yml"
      - "src/universal-consent.js"
      - "src/universal-consent.test.js"
      - "src/guest-gps.js"
      - "src/guest-gps.test.js"
      - "src/gps-telegram-alert.js"
      - "src/gps-telegram-alert.test.js"
      - "src/gps-verification-ui.js"
      - "src/index.js"
      - "src/temporary-ip-block.js"
      - ".github/workflows/consent-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check src/gps-verification-ui.js
          node --check src/guest-gps.js
          node --check src/guest-gps.test.js
          node --check src/gps-telegram-alert.js
          node --check src/gps-telegram-alert.test.js
          node --check src/jingxin-media.js
          node --check src/jingxin-media.test.js
          node --check src/universal-consent.js
          node --check src/universal-consent.test.js
          node --check src/temporary-ip-block.js
          node --check src/index.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify seven-zone routes parse at TOML root
        run: python3 .github/scripts/verify-routes.py
      - name: Install Wrangler for offline configuration check
        run: npm install --no-audit --no-fund
      - name: Wrangler dry-run (never deploys)
        run: npx wrangler deploy --dry-run --outdir .wrangler-route-test
      - name: Run all Worker regression tests
        run: npm test
