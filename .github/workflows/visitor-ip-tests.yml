name: Trusted visitor IP regression
on:
  push:
    branches: [main]
    paths:
      - "src/signed-visitor-ip.js"
      - "src/signed-visitor-ip.test.js"
      - "src/index.js"
      - ".github/workflows/visitor-ip-tests.yml"
  pull_request:
    paths:
      - "src/signed-visitor-ip.js"
      - "src/signed-visitor-ip.test.js"
      - "src/index.js"
      - ".github/workflows/visitor-ip-tests.yml"
permissions:
  contents: read
jobs:
  visitor-ip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test src/signed-visitor-ip.test.js
      - run: node --check src/index.js
